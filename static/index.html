<!DOCTYPE html>
<html>
<head>
    <title>PostmortemLink</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>PostmortemLink</h1>

    <p class="subtitle">
        Connect today's code changes with yesterday's production incidents.
    </p>

    <label>Enter a new code change</label>

    <textarea id="change"
        placeholder="Example: Improve payment timeout handling and retries"></textarea>

    <button onclick="analyze()">
        Analyze Change
    </button>

    <div id="result"></div>

</div>

<script src="app.js"></script>

</body>
</html>
